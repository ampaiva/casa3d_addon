name: Casa 3D
slug: casa3d
description: Planta interativa da casa para Home Assistant
version: "0.8.0"
panel_icon: mdi:home-map-marker
panel_title: Casa 3D
panel_admin: false
arch:
  - amd64

startup: services
boot: auto
init: false
host_network: false
homeassistant_api: true

ingress: true
ingress_port: 8000

map:
  - config:rw

options:
  tuya_room_sync: true
  tuya_voltage_fix: true
  energy_dashboard_sync: true
  energy_learning: true
  data_dir: "/data"
  ha_url: "http://homeassistant:8123"
  ha_token: ""
  floor_ground_image: "casa_3d_terreo-v18.webp"
  floor_upper_image: "casa_3d_superior-original.webp"

schema:
  tuya_room_sync: bool
  tuya_voltage_fix: bool
  energy_dashboard_sync: bool
  energy_learning: bool
  data_dir: str
  ha_url: str
  ha_token: password
  floor_ground_image: str
  floor_upper_image: str
